# Backend (Node + Express + Prisma) → Azure App Service (Linux).
# Build runs on Ubuntu so Prisma engines match Linux App Service.
#
# GitHub → Settings → Secrets and variables → Actions:
#   AZURE_WEBAPP_NAME              — e.g. henry-api (name of the Web App)
#   AZURE_WEBAPP_BACKEND_PUBLISH_PROFILE — download from Azure Portal → Web App → Download publish profile
#   PRODUCTION_DATABASE_URL (optional, main only) — applies Prisma migrations from CI before deploy (Supabase/Azure Postgres)
#   PRODUCTION_DIRECT_URL (optional) — required if PRODUCTION_DATABASE_URL is a pooler; Supabase direct db.*:5432 URI
#
# App Service → Configuration → Application settings (examples):
#   DATABASE_URL, JWT_SECRET, CORS_ORIGIN (your Static Web App URL), NODE_ENV=production
#
# Migrations run on each cold start via npm run start (prisma migrate deploy).

name: Azure App Service — backend API

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/azure-app-service-backend.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    # Avoid overlapping OneDeploy runs to the same Web App (often surfaces as HTTP 409 Conflict).
    concurrency:
      group: azure-app-service-backend-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies and generate Prisma Client
        working-directory: backend
        run: npm ci

      - name: Prisma migrate deploy (production DB, optional)
        if: github.ref == 'refs/heads/main'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
        run: npm run db:deploy:ci

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_BACKEND_PUBLISH_PROFILE }}
          package: backend
