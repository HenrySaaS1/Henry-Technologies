# Frontend → Azure Static Web Apps.
#
# Repo OR environment secrets (GitHub → Settings → Secrets → Actions — and Environment "prod"/"dev" if used):
#   AZURE_STATIC_WEB_APPS_API_TOKEN — Portal → Static Web App → Manage deployment token
#   OR AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_POND_05132FB0F — alternate SWA token (fallback)
#
# Missing token error: ensure at least one is set everywhere this workflow runs (for `environment: prod`, add the same secrets on the prod environment tab).
#
#   VITE_API_URL — REQUIRED on main/develop CI — backend base URL (https, no slash). prebuild injects /api/* proxy into staticwebapp.config.json; without it, login calls fail on the live site.
#   VITE_SITE_GATE_PASSWORD (optional) — build-time preview gate only

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v5

      # Fork PR workflows do not receive repository secrets — skip requirement below for those only.
      - name: Require deployment token for push / same-repo PR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SWA_A: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          SWA_B: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_POND_05132FB0F }}
        run: |
          if [ -n "$SWA_A" ] || [ -n "$SWA_B" ]; then
            exit 0
          fi
          echo '::error::AZURE_STATIC_WEB_APPS deployment token missing. Create one secret: AZURE_STATIC_WEB_APPS_API_TOKEN (or fallback AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_POND_05132FB0F). Azure Portal → Static Web App → Manage deployment token. GitHub → repo Settings → Secrets and variables → Actions (and duplicate on Environment prod/dev if this job uses environments).'

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_POND_05132FB0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          skip_deploy_on_missing_secrets: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          action: upload
          app_location: /frontend
          app_build_command: 'npm ci && npm run build'
          api_location: ''
          output_location: dist
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_SITE_GATE_PASSWORD: ${{ secrets.VITE_SITE_GATE_PASSWORD }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_POND_05132FB0F }}
          skip_deploy_on_missing_secrets: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          action: close
