# Frontend → Azure Static Web Apps.
# Secrets (GitHub → Settings → Secrets):
#   AZURE_STATIC_WEB_APPS_API_TOKEN — from Azure Portal → your Static Web App → Manage deployment token
#   VITE_API_URL — your backend base URL, e.g. https://henry-api.azurewebsites.net (no trailing slash)
#   VITE_SITE_GATE_PASSWORD (optional) — if set at build time, shows a password screen before the SPA (preview only; not secure).

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v5

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_POND_05132FB0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /frontend
          app_build_command: 'npm ci && npm run build'
          api_location: ''
          output_location: dist
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_SITE_GATE_PASSWORD: ${{ secrets.VITE_SITE_GATE_PASSWORD }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_POND_05132FB0F }}
          action: close
