# Apply `backend/prisma/migrations` to the live Postgres used by the API (Prisma — not Supabase CLI).
#
# GitHub → Settings → Secrets and variables → Actions:
#   PRODUCTION_DATABASE_URL — same as App Service DATABASE_URL (Supabase pooler or direct).
#   PRODUCTION_DIRECT_URL   — required if DATABASE_URL uses Supabase pooler (:6543); use direct db.*.supabase.co:5432 URI.
#
# Run: Actions → "Prisma migrate deploy (production)" → Run workflow
#
# If this hangs, Supabase may be blocking GitHub runners — use `npm run db:deploy:remote` locally with backend/.env.postgres instead.
# See docs/azure-new-account-fresh-setup.md §7.1

name: Prisma migrate deploy (production)

on:
  workflow_dispatch:

concurrency:
  group: prisma-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set repository secret PRODUCTION_DATABASE_URL (same as App Service DATABASE_URL)."
            exit 1
          fi
          echo "Applying Prisma migrations (uses DIRECT_URL when set for Supabase pooler)."
          npm run db:deploy:ci
