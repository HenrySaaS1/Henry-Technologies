# Deploy backend to Azure Web App **henry-api-new** (OIDC).
# Run manually: Actions → “Build and deploy Node.js app to Azure Web App - henry-api-new” → Run workflow.
# For automatic deploys on push to main, see `azure-app-service-backend.yml` (uses AZURE_WEBAPP_NAME).

name: Build and deploy Node.js app to Azure Web App - henry-api-new

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (backend)
        working-directory: backend
        run: npm ci

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: henry-backend-api-new
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: azure-webapp-henry-api-new-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: henry-backend-api-new
          path: backend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BB9159556C254CFCA82F6180F58E646A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_89C709E211DB40E19F5F3ED3BCBD94C7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2997C102A4D9463587DD993CD1C60713 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: henry-api-new
          slot-name: Production
          package: backend
